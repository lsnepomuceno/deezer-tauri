name: CI

# Every pull request to main, and main itself after a merge: a pull request is tested on
# its own branch, so two green branches can still produce a red main.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # 22.04 is the oldest runner with WebKitGTK 4.1, and building there keeps the
        # .deb and the AppImage loadable on older glibc (specs/features/004).
        os: [ ubuntu-22.04, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v7

      # No gstreamer1.0-plugins-bad: nothing here plays audio and the AppImage bundler
      # leaves that set out by default. Mirror fallback inside the script.
      - name: Linux system packages
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: scripts/ci-linux-packages.sh xvfb xdotool

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Node tools
        run: npm ci

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features e2e -- -D warnings

      - name: Bridge tests
        run: npm run test:bridge

      - name: Unit, IPC and capability tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The real binary in the platform's engine, against the fixture page.
      - name: End-to-end test
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --features e2e --test e2e

      - name: End-to-end test
        if: runner.os != 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features e2e --test e2e

      - name: Installers
        run: npm run tauri -- build

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
