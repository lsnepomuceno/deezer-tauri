name: Release

# A tag vX.Y.Z opens one draft release with that version's section of CHANGELOG.md as
# its notes, and the installers of every platform are attached to it (specs/features/004).
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag $version, Cargo.toml $cargo_version, tauri.conf.json $conf_version"
          test "$version" = "$cargo_version" && test "$version" = "$conf_version"

      # One draft, created here: four build jobs looking for a release that does not
      # exist yet each created their own, and split the installers between them.
      - name: Draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/changelog-section.sh "$GITHUB_REF_NAME" > notes.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Deezer Tauri $GITHUB_REF_NAME" \
            -F draft=true \
            -F body=@notes.md \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ''
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS (Intel)
            os: macos-latest
            args: '--target x86_64-apple-darwin'

    steps:
      - uses: actions/checkout@v7

      # No gstreamer1.0-plugins-bad: nothing here plays audio and the AppImage bundler
      # leaves that set out by default. Mirror fallback inside the script.
      - name: Linux system packages
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: scripts/ci-linux-packages.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Node tools
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.verify.outputs.release_id }}
