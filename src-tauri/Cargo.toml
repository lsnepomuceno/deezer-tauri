[package]
name = "deezer-tauri"
version = "0.1.1"
description = "Unofficial desktop shell for the Deezer web player"
authors = ["Lucas Nepomuceno"]
license = "MIT"
repository = "https://github.com/lsnepomuceno/deezer-tauri"
edition = "2021"
rust-version = "1.85"
default-run = "deezer-tauri"

[lib]
name = "deezer_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deezer-tauri"
path = "src/main.rs"

[features]
# The end-to-end harness of specs/features/002-media-bridge. Never in a release build.
e2e = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
url = "2.5.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "test"] }
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
