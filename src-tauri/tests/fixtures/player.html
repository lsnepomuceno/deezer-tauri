<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture player</title>
  <style>html, body { height: 100%; margin: 0; }</style>
</head>
<body>
  <p>A page that uses the Media Session API the way the Deezer web player does.</p>
  <script>
    (function () {
      var tracks = [
        { title: 'Fixture Track One', artist: 'Fixture Artist', album: 'Fixture Album' },
        { title: 'Fixture Track Two', artist: 'Fixture Artist', album: 'Fixture Album' }
      ];
      var session = navigator.mediaSession;
      var index = 0;

      function load(next) {
        index = next;
        var track = tracks[index];
        session.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: track.album,
          artwork: [
            { src: 'https://e2e.invalid/cover-250.jpg', sizes: '250x250', type: 'image/jpeg' },
            { src: 'https://e2e.invalid/cover-500.jpg', sizes: '500x500', type: 'image/jpeg' }
          ]
        });
        session.setActionHandler('previoustrack', index > 0 ? function () { load(index - 1); } : null);
      }

      // A sign-in popup proves it kept its opener by writing back to this page.
      window.addEventListener('message', function (event) {
        if (typeof event.data === 'string' && event.data.indexOf('popup-ready ') === 0) {
          window.__popup = event.source;
          session.metadata = new MediaMetadata({ title: 'Popup Opened ' + event.data.slice(12), artist: 'Fixture Artist' });
        }
      });

      // A three-step sign-in hands its result back once it is done.
      window.addEventListener('message', function (event) {
        if (typeof event.data === 'string' && event.data.indexOf('signed-in ') === 0) {
          window.__signIn = event.source;
          session.metadata = new MediaMetadata({ title: 'Signed In ' + event.data.slice(10), artist: 'Fixture Artist' });
        }
      });

      // The harness arms a URL and clicks the page, so the popup opens within a user gesture.
      document.addEventListener('click', function () {
        if (window.__nextPopup) {
          var target = window.__nextPopup;
          window.__nextPopup = null;
          window.open(target, '_blank', 'width=520,height=640');
        }
      });

      session.playbackState = 'paused';
      session.setActionHandler('play', function () { session.playbackState = 'playing'; });
      session.setActionHandler('pause', function () { session.playbackState = 'paused'; });
      session.setActionHandler('nexttrack', function () { load(Math.min(index + 1, tracks.length - 1)); });
      load(0);
    })();
  </script>
</body>
</html>
